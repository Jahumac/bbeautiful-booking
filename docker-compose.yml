services:
  bbeautiful:
    image: bbeautiful-booking:v1.1
    container_name: bbeautiful
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      - BASE_URL=${BBEAUTIFUL_BASE_URL:-https://bbeautiful.me}
      - DEBUG_MODE=FALSE
      - DB_HOST=mysql
      - DB_NAME=easyappointments
      - DB_USERNAME=easyappointments
      - DB_PASSWORD=${BBEAUTIFUL_DB_PASSWORD:?set BBEAUTIFUL_DB_PASSWORD}
      - MAIL_PROTOCOL=mail
      - MAIL_SMTP_DEBUG=0
      - MAIL_SMTP_AUTH=0
    depends_on:
      - mysql
    volumes:
      - /mnt/user/appdata/easyappointments/storage:/var/www/html/storage

  mysql:
    image: mysql:8.0
    container_name: bbeautiful-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${BBEAUTIFUL_DB_ROOT_PASSWORD:?set BBEAUTIFUL_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=easyappointments
      - MYSQL_USER=easyappointments
      - MYSQL_PASSWORD=${BBEAUTIFUL_DB_PASSWORD:?set BBEAUTIFUL_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
